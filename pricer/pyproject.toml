[project]
name = "oddlot-pricer"
version = "0.1.0"
description = "WS2 — Black-Scholes + Gemini crowd pricer, hedger, FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "pydantic>=2.9.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "jsonschema>=4.23.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oddlot_pricer*"]

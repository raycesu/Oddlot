[package]
name = "oddlot"
version = "0.1.0"
description = "Oddlot — fractional SPY options vault on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "oddlot"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", features = ["token_2022"] }

[dev-dependencies]
anchor-lang = "1.2.2"
litesvm = "=0.15.2"
pyth-solana-receiver-sdk = "2.0.0"
solana-account = "4"
solana-clock = "3"
solana-instruction = "3.4"
solana-keypair = "3"
solana-message = "4"
solana-sdk-ids = "3"
solana-signer = "3"
solana-syscalls = "=4.1.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4"
spl-associated-token-account-interface = "2"
spl-token-2022-interface = "2"
spl-token-interface = "2"
spl-token-metadata-interface = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
